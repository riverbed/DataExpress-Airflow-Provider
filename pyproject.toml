[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-airflow-providers-dx"
version = "1.0.0"
description = "Apache Airflow provider for Riverbed Data Express (locations, profiles, transfer jobs)"
readme = "README.rst"
license = { text = "Apache-2.0" }
authors = [
    { name = "Renjith Vadakkekkara", email = "renjith.vadakkekkara@riverbed.com" },
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.2.2,<3.3.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/riverbed/DataExpress-Airflow-Provider"
Documentation = "https://github.com/riverbed/DataExpress-Airflow-Provider/tree/main/docs"
Repository = "https://github.com/riverbed/DataExpress-Airflow-Provider"
"Bug Tracker" = "https://github.com/riverbed/DataExpress-Airflow-Provider/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.package-data]
"airflow.providers.dx" = ["py.typed"]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.dx.get_provider_info:get_provider_info"

[tool.setuptools.packages.find]
where = ["src"]
include = ["airflow.providers.dx*"]
namespaces = true
