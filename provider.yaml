---
package-name: apache-airflow-providers-dx
name: Riverbed Data Express
description: |
  `Riverbed Data Express (DX)`__ — orchestrate locations, transfer profiles,
  and data transfer jobs via the Profiles and Jobs REST APIs.

state: ready
source-date-epoch: 1748822400

versions:
  - 1.0.0

integrations:
  - integration-name: Riverbed Data Express
    external-doc-url: https://github.com/riverbed/DataExpress-Airflow-Provider/tree/main/docs
    tags: [service]

hooks:
  - integration-name: Riverbed Data Express
    python-modules:
      - airflow.providers.dx.hooks.dx

operators:
  - integration-name: Riverbed Data Express
    python-modules:
      - airflow.providers.dx.operators.location
      - airflow.providers.dx.operators.profile
      - airflow.providers.dx.operators.job

sensors:
  - integration-name: Riverbed Data Express
    python-modules:
      - airflow.providers.dx.sensors.location
      - airflow.providers.dx.sensors.job

triggers:
  - integration-name: Riverbed Data Express
    python-modules:
      - airflow.providers.dx.triggers.job
      - airflow.providers.dx.triggers.location

connection-types:
  - hook-class-name: airflow.providers.dx.hooks.dx.DxHook
    hook-name: Data Express
    connection-type: dx
    conn-fields:
      api_key:
        label: API key (Bearer token)
        schema:
          type: string
          format: password
      base_url:
        label: DX API base URL (host root for /api/v1/*)
        schema:
          type: string
      jobs_base_url:
        label: Jobs API base URL (advanced override)
        schema:
          type: string
      profiles_base_url:
        label: Profiles API base URL (advanced override)
        schema:
          type: string
      verify_ssl:
        label: Verify TLS certificates
        schema:
          type: boolean
    ui-field-behaviour:
      hidden-fields:
        - schema
        - port
        - login
        - host
        - password
      relabeling:
        extra: Extra JSON (api_key, verify_ssl, …)
      placeholders:
        extra: |
          {
            "api_key": "your-api-key",
            "base_url": "https://api.dx-dev.riverbed.com"
          }
